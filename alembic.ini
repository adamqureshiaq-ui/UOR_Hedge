# Alembic settings. The database URL is NOT here: migrations/env.py reads DATABASE_URL (via database.py),
# so migrations always run against the same database as the app.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# Name migration files like 2026_11_12_1530-ab12cd34ef56_add_watchlist.py so they sort by date
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s